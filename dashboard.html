<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usama's Bots</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #07090e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 55%),
                radial-gradient(circle at 85% 70%, rgba(59, 130, 246, 0.06) 0%, transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
        }

        .main-container {
            max-width: 780px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ===== MAIN CARD ===== */
        .glass-card {
            background: rgba(16, 19, 30, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .icon-wrapper {
            width: 58px;
            height: 58px;
            background: linear-gradient(145deg, #10b981, #047857);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 14px 28px -10px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header-text p {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.8s ease-in-out infinite;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== SERVER SELECTOR ===== */
        .server-selector {
            margin-bottom: 32px;
        }

        .selector-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .selector-label i {
            font-size: 13px;
            color: #10b981;
        }

        .server-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .server-option {
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid rgba(255, 255, 255, 0.05);
            border-radius: 22px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .server-option:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        .server-option.active {
            background: rgba(16, 185, 129, 0.06);
            border-color: #10b981;
            box-shadow: 0 0 0 1.5px #10b981, 0 12px 32px -16px rgba(16, 185, 129, 0.25);
        }

        .server-option .server-icon {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
        }

        .server-option.active .server-icon {
            color: #10b981;
        }

        .server-option .name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .server-option .status-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
            align-self: flex-start;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .server-option.active .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.15);
        }

        .server-option .hidden-url {
            font-size: 0px;
            /* completely hidden */
            opacity: 0;
            height: 0;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
        }

        /* ===== CONNECT BUTTON ===== */
        .action-area {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .connect-btn {
            width: 100%;
            padding: 20px 28px;
            background: linear-gradient(145deg, #10b981, #047857);
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 14px 36px -14px rgba(16, 185, 129, 0.4);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
        }

        .connect-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 18px 44px -14px rgba(16, 185, 129, 0.5);
        }

        .connect-btn:active {
            transform: scale(0.97);
        }

        .connect-btn i {
            font-size: 20px;
        }

        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .info-bar span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.2px;
            font-weight: 500;
        }

        .info-bar i {
            margin-right: 6px;
            color: rgba(255, 255, 255, 0.1);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(16, 19, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .footer .brand {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
        }

        .footer .brand i {
            color: #10b981;
            margin: 0 4px;
        }

        .social-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .social-links a i {
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .social-links a .channel-label {
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
        }

        .footer-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.04), transparent);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.2px;
        }

        .footer-bottom a {
            color: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            transition: 0.2s;
        }

        .footer-bottom a:hover {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .glass-card {
                padding: 28px 20px;
                border-radius: 28px;
            }
            .server-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .header-text h1 {
                font-size: 20px;
            }
            .icon-wrapper {
                width: 48px;
                height: 48px;
                font-size: 22px;
                border-radius: 14px;
            }
            .connect-btn {
                padding: 16px 20px;
                font-size: 16px;
            }
            .footer {
                padding: 22px 18px;
                border-radius: 24px;
            }
            .social-links a {
                padding: 8px 16px;
                font-size: 12px;
            }
            .social-links a i {
                font-size: 16px;
            }
            .footer-bottom {
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
        }

        @media (max-width: 400px) {
            .glass-card {
                padding: 20px 14px;
            }
            .server-option {
                padding: 18px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- ===== MAIN CARD ===== -->
        <div class="glass-card">

            <!-- Header -->
            <div class="header">
                <div class="icon-wrapper">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="header-text">
                    <h1>Usama's Bots</h1>
                    <p><span class="pulse"></span> 2 servers online</p>
                </div>
            </div>

            <!-- Server Selector -->
            <div class="server-selector">
                <div class="selector-label">
                    <i class="fas fa-server"></i> Select Server
                </div>

                <div class="server-grid" id="serverGrid">
                    <!-- Server 1 -->
                    <div class="server-option active" data-url="http://93.177.64.145:8355">
                        <div class="server-icon"><i class="fas fa-crown"></i></div>
                        <span class="name">Server 1</span>
                        <span class="status-badge"><i class="fas fa-circle" style="color:#10b981;font-size:8px;margin-right:4px;"></i> Live</span>
                        <span class="hidden-url">http://93.177.64.145:8355</span>
                    </div>

                    <!-- Server 2 -->
                    <div class="server-option" data-url="http://160.191.77.60:8073">
                        <div class="server-icon"><i class="fas fa-server"></i></div>
                        <span class="name">Server 2</span>
                        <span class="status-badge"><i class="fas fa-circle" style="color:#f59e0b;font-size:8px;margin-right:4px;"></i> Standby</span>
                        <span class="hidden-url">http://160.191.77.60:8073</span>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="action-area">
                <button class="connect-btn" id="connectBtn">
                    <i class="fas fa-plug"></i> Connect Bot
                </button>

                <div class="info-bar">
                    <span><i class="far fa-clock"></i> Last ping: 1 min ago</span>
                    <span><i class="fas fa-shield-alt"></i> TLS 1.3 encrypted</span>
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="brand">
                <i class="fas fa-bolt"></i> BOT MANAGER <i class="fas fa-bolt"></i>
            </div>

            <div class="social-links">
                <a href="https://whatsapp.com/channel/0029VavSK8U8fewp1htKiS21" target="_blank">
                    <i class="fab fa-whatsapp" style="color:#25D366;"></i>
                    WhatsApp <span class="channel-label">| Channel</span>
                </a>
                <a href="https://chat.whatsapp.com/HItKQi26s0KHMteTzGp99b?s=cl&p=a&ilr=0" target="_blank">
                    <i class="fab fa-whatsapp" style="color:#26A5E4;"></i>
                    WhatsApp <span class="channel-label">| Group</span>
                </a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom">
                <span>© 2026 Usama's Bots — All rights reserved</span>
                <span>
                    <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">Status</a>
                </span>
            </div>
        </div>

    </div>

    <script>
        (function() {
            const serverOptions = document.querySelectorAll('.server-option');
            const connectBtn = document.getElementById('connectBtn');
            let selectedUrl = 'http://93.177.64.145:8355'; // default

            // --- Selector logic ---
            serverOptions.forEach(option => {
                option.addEventListener('click', function() {
                    serverOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');

                    selectedUrl = this.dataset.url;

                    const serverName = this.querySelector('.name')?.textContent?.trim() || 'Server';
                    connectBtn.innerHTML = `<i class="fas fa-plug"></i> Connect to ${serverName}`;
                });
            });

            // --- Connect button ---
            connectBtn.addEventListener('click', function() {
                this.disabled = true;
                this.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Connecting...`;

                setTimeout(() => {
                    // Redirect to selected server
                    window.location.href = selectedUrl;

                    // Fallback if redirect doesn't happen
                    setTimeout(() => {
                        this.disabled = false;
                        const active = document.querySelector('.server-option.active');
                        const name = active?.querySelector('.name')?.textContent?.trim() || 'Server';
                        this.innerHTML = `<i class="fas fa-plug"></i> Connect to ${name}`;
                    }, 3000);
                }, 1200);
            });

            // --- Init button text ---
            const defaultServer = document.querySelector('.server-option.active');
            if (defaultServer) {
                const name = defaultServer.querySelector('.name')?.textContent?.trim() || 'Server';
                connectBtn.innerHTML = `<i class="fas fa-plug"></i> Connect to ${name}`;
            }

        })();
    </script>

</body>
</html>
